[versions]
kotlin = "2.4.10"
ktor = "3.5.1"
exposed = "1.0.0-rc-2"
logback = "1.6.1"
kotest = "6.2.3"
khealth = "3.0.2"
r2dbcPool = "1.0.2.RELEASE"
r2dbcPostgresql = "1.1.2.RELEASE"
ktorRateLimiting = "2.3.0"
kotlinxSerialization = "1.11.0"
reflections = "0.10.2"
jbcrypt = "0.4"
minio = "9.0.3"
googleApiClient = "2.9.0"
awsSdk = "2.49.5"
webPush = "5.1.2"
expoServerSdk = "3.1.6"

[libraries]
# Ktor artifacts are versioned by the BOM the io.ktor.plugin applies.
ktor-client-cio = { module = "io.ktor:ktor-client-cio" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt" }
ktor-server-auto-head-response = { module = "io.ktor:ktor-server-auto-head-response" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors" }
ktor-server-default-headers = { module = "io.ktor:ktor-server-default-headers" }
ktor-server-host-common = { module = "io.ktor:ktor-server-host-common" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc", version.ref = "exposed" }

r2dbc-pool = { module = "io.r2dbc:r2dbc-pool", version.ref = "r2dbcPool" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbcPostgresql" }

khealth = { module = "dev.hayden:khealth", version.ref = "khealth" }
ktor-rate-limiting = { module = "io.github.flaxoos:ktor-server-rate-limiting", version.ref = "ktorRateLimiting" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
reflections = { module = "org.reflections:reflections", version.ref = "reflections" }
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
minio = { module = "io.minio:minio", version.ref = "minio" }

google-api-client = { module = "com.google.api-client:google-api-client", version.ref = "googleApiClient" }
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
aws-ses = { module = "software.amazon.awssdk:ses" }
web-push = { module = "nl.martijndwars:web-push", version.ref = "webPush" }
expo-server-sdk = { module = "io.github.hlspablo:expo-server-sdk-java", version.ref = "expoServerSdk" }

kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-assertions-ktor = { module = "io.kotest:kotest-assertions-ktor", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }

[bundles]
ktor-client = ["ktor-client-cio", "ktor-client-content-negotiation"]
ktor-server = [
    "ktor-serialization-kotlinx-json",
    "ktor-server-auth",
    "ktor-server-auth-jwt",
    "ktor-server-auto-head-response",
    "ktor-server-call-logging",
    "ktor-server-content-negotiation",
    "ktor-server-core",
    "ktor-server-cors",
    "ktor-server-default-headers",
    "ktor-server-host-common",
    "ktor-server-netty",
    "ktor-server-sse",
    "ktor-server-status-pages",
    "ktor-server-websockets",
]
kotest = [
    "kotest-runner-junit5",
    "kotest-assertions-core",
    "kotest-assertions-ktor",
    "kotest-property",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
