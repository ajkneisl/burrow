<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" href="/image/burrow.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="index,follow"><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <script type="module" src="https://unpkg.com/@googlemaps/extended-component-library@0.6"></script>
    <script>
        (function() {
            var ua = navigator.userAgent || '';
            if (!/Android/i.test(ua)) return;
            var p = window.location.pathname;
            if (p.startsWith('/user/') || p.startsWith('/burrow/') || p.startsWith('/discuss/')) {
                window.location.href = 'intent:/' + p + '#Intent;scheme=app.umn.burrow;package=app.umn.burrow;S.browser_fallback_url=' + encodeURIComponent(window.location.href) + ';end';
            }
        })();
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
